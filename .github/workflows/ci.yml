name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The suite migrates into this database and truncates it between test
          # classes; creating it here saves a setup step.
          POSTGRES_DB: tangram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Locally the tests default to the Dockerised Postgres on 5433; the
      # service container above is reachable on the standard port instead.
      TANGRAM_TEST_POSTGRES: "Host=localhost;Port=5432;Database=tangram_test;Username=postgres;Password=postgres"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # Firebase:ProjectId is seeded by a module initializer in the test
      # assembly, so no secret is needed here -- see TestEnvironment.cs.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    env:
      # Placeholders. Firebase web config is read at module load during the
      # prerender, and these values are never used to reach Firebase in CI --
      # nothing here authenticates. Real values come from .env.local locally and
      # from the host's environment when deployed.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy
    # The whole point of gating: a red suite must not reach production. Both
    # platforms' own git integrations would deploy on every push regardless, so
    # Koyeb auto-deploy and Vercel auto-deploy are both turned off and the
    # deployment is driven from here instead.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Lets the repo be pushed to before the hosting accounts exist without
      # painting main red. Once the secrets are set these steps start running
      # on their own.
      - name: Check which deploy targets are configured
        id: targets
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$KOYEB_TOKEN" ]; then echo "koyeb=true" >> "$GITHUB_OUTPUT"; else
            echo "koyeb=false" >> "$GITHUB_OUTPUT"; echo "::notice::KOYEB_TOKEN not set — skipping backend deploy"; fi
          if [ -n "$VERCEL_TOKEN" ]; then echo "vercel=true" >> "$GITHUB_OUTPUT"; else
            echo "vercel=false" >> "$GITHUB_OUTPUT"; echo "::notice::VERCEL_TOKEN not set — skipping frontend deploy"; fi

      # Redeploy rather than koyeb/action-git-deploy: the action re-declares the
      # whole service on every run, which risks clobbering the environment
      # variables that hold the database password. Redeploy rebuilds the
      # existing service from the latest commit on its configured branch and
      # touches nothing else. The service must already exist — see README.
      - name: Install and authenticate the Koyeb CLI
        if: steps.targets.outputs.koyeb == 'true'
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}

      - name: Deploy backend
        if: steps.targets.outputs.koyeb == 'true'
        run: koyeb service redeploy tangram/api

      - uses: actions/setup-node@v5
        if: steps.targets.outputs.vercel == 'true'
        with:
          node-version: "22"

      - name: Deploy frontend
        if: steps.targets.outputs.vercel == 'true'
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
