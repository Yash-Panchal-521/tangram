name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The suite migrates into this database and truncates it between test
          # classes; creating it here saves a setup step.
          POSTGRES_DB: tangram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Locally the tests default to the Dockerised Postgres on 5433; the
      # service container above is reachable on the standard port instead.
      TANGRAM_TEST_POSTGRES: "Host=localhost;Port=5432;Database=tangram_test;Username=postgres;Password=postgres"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # Firebase:ProjectId is seeded by a module initializer in the test
      # assembly, so no secret is needed here -- see TestEnvironment.cs.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest

    env:
      # Placeholders. Firebase web config is read at module load during the
      # prerender, and these values are never used to reach Firebase in CI --
      # nothing here authenticates. Real values come from .env.local locally and
      # from the host's environment when deployed.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  promote:
    name: Promote to deploy
    # `deploy` is the last-known-green pointer. Render's Auto-Deploy watches it,
    # so a green build reaches the backend on its own and no deploy credential
    # exists anywhere -- the gate is the branch rather than the trigger.
    #
    # Vercel watches `release`, which the job below advances only once the
    # backend is confirmed live. The hosts watch different branches on purpose:
    # an old frontend against a new API ignores fields it does not know, and a
    # new frontend against an old API is a broken page.
    #
    # This replaced a CLI-based Vercel deploy that needed three repository
    # secrets and a build step to achieve what pointing Vercel's production
    # branch at `deploy` does on its own.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # The push below needs real history, not the default shallow clone.
          fetch-depth: 0

      # force-with-lease rather than force: if someone pushed to `deploy`
      # by hand, this fails loudly instead of silently discarding it.
      - name: Promote main to the deploy branch
        run: git push origin HEAD:deploy --force-with-lease

  ship:
    name: Release the frontend, and confirm both are live
    # The step this replaces was `git ship`, typed by hand. It is the right
    # sequence -- backend first, then frontend -- and it is one a human forgets:
    # during v4 the frontend sat three commits behind a green `deploy` for hours
    # because nobody ran it. The failure was safe and it still shipped nothing.
    #
    # Waiting on the deployments rather than on a timer, because a timer is a
    # guess that is wrong in both directions: too short and the frontend goes out
    # first, too long and every release drags. Both hosts report the commit they
    # are running, so "is it live" is a question with an answer.
    #
    # Both halves are checked. Advancing a branch is not a deploy, it is the
    # trigger for one — so confirming the backend and then trusting Vercel would
    # leave the same blind spot this job was written to remove, one step later.
    needs: [promote]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      API: https://tangram-hk8a.onrender.com
      WEB: https://tangram-mu.vercel.app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for Render to serve this commit
        run: |
          # ~10 minutes. A free instance may be asleep when this starts, and the
          # first request wakes it -- which is slow but is also exactly the probe
          # we want. Deploys that take longer than this are a problem to look at
          # rather than to wait through.
          for attempt in $(seq 1 40); do
            live=$(curl -fsS --max-time 30 "$API/health" | jq -r '.commit // empty' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Backend is serving $GITHUB_SHA after ~$((attempt * 15))s."
              exit 0
            fi
            echo "attempt $attempt: serving '${live:-unreachable}', want $GITHUB_SHA"
            sleep 15
          done

          echo "::error::Render did not serve $GITHUB_SHA within 10 minutes."
          echo "The frontend was NOT released, which is the safe direction: an old"
          echo "frontend against a new API ignores fields it does not know."
          exit 1

      # Only now, and never before: Vercel builds whatever this points at.
      - name: Advance the release branch
        run: git push origin HEAD:release --force-with-lease

      - name: Wait for Vercel to serve this commit
        run: |
          # Advancing the branch is not the deploy, it is the trigger for one.
          # Without this the job could report success for a Vercel build that
          # failed, leaving a green pipeline, a correct branch pointer and the
          # previous frontend still serving — which is exactly the failure this
          # job exists to prevent, one step later.
          #
          # The route sends Cache-Control: no-store, so what comes back is the
          # deployment rather than the CDN's memory of the last one.
          for attempt in $(seq 1 40); do
            live=$(curl -fsS --max-time 30 "$WEB/api/health" | jq -r '.commit // empty' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Frontend is serving $GITHUB_SHA after ~$((attempt * 15))s."
              exit 0
            fi
            echo "attempt $attempt: serving '${live:-unreachable}', want $GITHUB_SHA"
            sleep 15
          done

          echo "::error::Vercel did not serve $GITHUB_SHA within 10 minutes."
          echo "The backend IS live at this commit and the release branch HAS moved,"
          echo "so this is a Vercel build to go and look at — not something to re-run."
          exit 1
